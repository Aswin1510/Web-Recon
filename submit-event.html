<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="Submit a campus event to BMSCE EventHub."><title>Submit Event | BMSCE EventHub</title><link rel="stylesheet" href="style.css"></head>
<body data-page="submit"><header class="site-header"><div class="container nav-shell"><a class="brand" href="index.html" aria-label="BMSCE EventHub home"><span class="brand-mark"><img src="BMSCE.jpeg" alt="BMSCE logo"></span><span><strong>BMSCE</strong><em>EventHub</em></span></a><button class="nav-toggle" type="button" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button><nav class="main-nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="events.html">Explore Events</a><a class="active" href="submit-event.html">Submit Event</a><a href="about.html">About</a></nav></div></header><main><section class="page-intro container"><p class="kicker">Put it on the map</p><h1>Share what’s<br><span>happening.</span></h1><p>Got a workshop, club meet or competition coming up? Give the campus a heads-up.</p></section><section class="container form-wrap"><form id="event-form" class="event-form" novalidate><div class="form-grid"><div class="field-row"><label for="title">Event title *</label><input id="title" name="title" required placeholder="e.g. ForgeML Peer Learning Session"><small class="field-error" data-error-for="title"></small></div><div class="field-row"><label for="category">Category *</label><select id="category" name="category" required><option value="">Select a category</option><option>Workshop</option><option>Hackathon</option><option>Competition</option><option>Fest</option><option>Seminar/Talk</option><option>Cultural Event</option><option>Technical Event</option><option>Club Activity</option><option>Other</option></select><small class="field-error" data-error-for="category"></small></div><div class="field-row full"><label for="description">Description *</label><textarea id="description" name="description" rows="4" required placeholder="What should students know?"></textarea><small class="field-error" data-error-for="description"></small></div><div class="field-row"><label for="organizer">Organizer / department *</label><select id="organizer" name="organizer" required><option value="">Select organizer</option><option>CSE</option><option>ISE</option><option>ECE</option><option>EEE</option><option>Mechanical</option><option>Civil</option><option>AI/ML</option><option>Coding Club</option><option>Cultural Club</option><option>Entrepreneurship Cell</option><option>Other</option></select><small class="field-error" data-error-for="organizer"></small></div><div class="field-row"><label for="venue">Venue *</label><input id="venue" name="venue" required placeholder="UG CS Lab 1"><small class="field-error" data-error-for="venue"></small></div><div class="field-row"><label for="eventDate">Event date *</label><input id="eventDate" name="eventDate" type="date" required><small class="field-error" data-error-for="eventDate"></small></div><div class="field-row"><label for="startTime">Start time *</label><input id="startTime" name="startTime" type="time" required><small class="field-error" data-error-for="startTime"></small></div><div class="field-row"><label for="endTime">End time</label><input id="endTime" name="endTime" type="time"><small class="field-error" data-error-for="endTime"></small></div><div class="field-row"><label for="eligibility">Eligibility</label><input id="eligibility" name="eligibility" placeholder="Open to all branches"><small class="field-error" data-error-for="eligibility"></small></div><div class="field-row"><label for="entryFee">Entry fee</label><input id="entryFee" name="entryFee" placeholder="Free"><small class="field-error" data-error-for="entryFee"></small></div><div class="field-row"><label for="registrationDeadline">Registration deadline</label><input id="registrationDeadline" name="registrationDeadline" type="date"><small class="field-error" data-error-for="registrationDeadline"></small></div><div class="field-row full"><label for="registrationLink">Registration link *</label><input id="registrationLink" name="registrationLink" type="url" required placeholder="https://forms.google.com/..."><small class="field-error" data-error-for="registrationLink"></small></div><div class="field-row"><label for="contactPerson">Contact person *</label><input id="contactPerson" name="contactPerson" required placeholder="Name"><small class="field-error" data-error-for="contactPerson"></small></div><div class="field-row"><label for="contactInfo">Contact email or phone *</label><input id="contactInfo" name="contactInfo" required placeholder="hello@club.com"><small class="field-error" data-error-for="contactInfo"></small></div><div class="field-row full"><label for="posterImage">Poster image URL</label><input id="posterImage" name="posterImage" type="url" placeholder="https://..."><small class="field-error" data-error-for="posterImage"></small></div><div class="field-row full confirmation"><label><input id="confirm-details" name="confirm" type="checkbox"><span>I confirm that the event information is correct. *</span></label><small class="field-error" data-error-for="confirm"></small></div></div><div class="form-submit"><button id="submit-button" class="button button-lime" type="submit"><span class="btn-label">Publish event ↗</span><span class="spinner hidden"></span></button><p id="form-success" class="form-success hidden"></p></div></form></section></main><footer class="site-footer"><div class="container footer-inner"><a class="brand" href="index.html"><span class="brand-mark"><img src="BMSCE.jpeg" alt="BMSCE logo"></span><span><strong>BMSCE</strong><em>EventHub</em></span></a><p>A student project for BMS College of Engineering</p><span>© <span id="year"></span></span></div></footer><div id="toast-root"></div><script src="script.js"></script></body></html>
